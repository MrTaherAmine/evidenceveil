name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build Python distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Clean build outputs
        shell: bash
        run: rm -rf dist build src/evidenceveil.egg-info

      - name: Build
        run: python -m build

      - name: Validate distributions
        run: twine check dist/*.whl dist/*.tar.gz

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          sha256sum \
            dist/*.whl \
            dist/*.tar.gz \
            > dist/SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: evidenceveil-python-dist
          path: dist/
          retention-days: 14
