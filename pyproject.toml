[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidenceveil"
version = "1.0.1"
description = "Local-first privacy engineering for cybersecurity evidence sharing"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Taher Amine ELHOUARI", email = "maintainer@taheramine.org"}]
keywords = ["cybersecurity", "privacy", "incident-response", "pseudonymization", "de-identification", "dfir"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = [
  "typer>=0.16,<1",
  "rich>=13,<15",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "jsonschema>=4.22,<5",
  "cryptography>=50,<51",
  "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "hypothesis>=6.110,<7",
  "ruff>=0.8,<1",
  "mypy>=1.11,<2",
  "build>=1.2,<2",
  "twine>=5,<7",
  "pip-audit>=2.7,<3",
  "bandit>=1.7,<2",
  "types-PyYAML>=6.0",
]
[project.scripts]
evidenceveil = "evidenceveil.cli.app:main"

[project.urls]
Homepage = "https://www.taheramine.org"
Repository = "https://github.com/MrTaherAmine/evidenceveil"
Issues = "https://github.com/MrTaherAmine/evidenceveil/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"evidenceveil.builtin_policies" = ["*.yaml"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["evidenceveil"]

[tool.coverage.report]
fail_under = 90
show_missing = true
omit = ["src/evidenceveil/cli/app.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"src/evidenceveil/cli/app.py" = ["B008"]
"tests/**/*.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["evidenceveil"]

