policy_version: "1.0"
id: reversible-investigation
title: Reversible authorized investigation workspace
release_model: authorized-investigator
default_action: review
key_scope: per_project
tlp: {label: TLP:AMBER+STRICT, set_by_user: true}
rules:
  - id: secrets
    priority: 1000
    match: {semantic_types: [authentication.secret, authentication.token]}
    action: {type: redact, replacement: "[SECRET_REMOVED]"}
  - id: reversible-identifiers
    priority: 850
    match: {semantic_types: [identity.username, identity.email, identity.employee_id, identity.customer_id, network.ip, infrastructure.hostname, network.domain, network.url, network.mac, identifier.session, identifier.uuid, cloud.account, cloud.aws.account, cloud.azure.tenant, cloud.azure.subscription, cloud.gcp.project, cloud.kubernetes.namespace, cicd.repository]}
    action: {type: pseudonymize, namespace: reversible}
  - id: time
    priority: 600
    match: {semantic_types: [time.event]}
    action: {type: shift, preserve_order: true, preserve_deltas: true}
utility: {preserve: [event_order, entity_correlation, schema_validity, field_types]}
risk: {block_on_secret: true}
